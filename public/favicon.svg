<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Avatar background: deep purple radial gradient matching .avatar in CSS -->
    <radialGradient id="avatarBg" cx="35%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="hsl(252,80%,38%)" />
      <stop offset="100%" stop-color="hsl(225,50%,14%)" />
    </radialGradient>
    <!-- Subtle ring accent matching the avatar-ring conic gradient -->
    <linearGradient id="ringAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa" />
      <stop offset="50%"  stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Outer ring (3px) — matches avatar-ring colour -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="url(#ringAccent)" stroke-width="3" opacity="0.7" />

  <!-- Avatar circle -->
  <circle cx="50" cy="50" r="45" fill="url(#avatarBg)" />

  <!-- Inner highlight: faint top-left sheen matching box-shadow inset -->
  <circle cx="50" cy="50" r="45" fill="none"
    stroke="rgba(255,255,255,0.10)" stroke-width="1"
    stroke-dasharray="100 200" stroke-dashoffset="-30" />

  <!-- "RG" — white, bold, matching avatar-initials: font-weight 700, letter-spacing -0.03em -->
  <text
    x="50" y="66"
    font-family="'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40"
    font-weight="700"
    letter-spacing="-1.2"
    fill="rgba(255,255,255,0.93)"
    text-anchor="middle"
  >RG</text>
</svg>
